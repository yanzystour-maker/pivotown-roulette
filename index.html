<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пивотаун — Рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a10; color: #e8e8e8; padding: 20px; }
        .error-box { background: #ff000020; border: 1px solid #ff4444; border-radius: 16px; padding: 16px; margin-bottom: 20px; display: none; }
        .error-box pre { color: #ff8888; font-size: 12px; white-space: pre-wrap; }
        .card { background: #13131a; border-radius: 24px; padding: 20px; }
        .spin-btn { width: 100%; padding: 18px; background: #d4a843; border: none; border-radius: 16px; font-weight: bold; cursor: pointer; }
        .debug { font-size: 10px; color: #888; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>
<div id="errorBox" class="error-box"><pre id="errorText"></pre></div>
<div class="card">
    <h1>🎰 Рулетка Пивотаун</h1>
    <button class="spin-btn" id="spinBtn" disabled>Загрузка...</button>
    <div id="result"></div>
    <div class="debug" id="debug"></div>
</div>

<script>
const API_URL = 'https://d5d79np5hkca8nqnm8d1.wnq2w1o5.apigw.yandexcloud.net';
const tg = window.Telegram.WebApp;
tg.expand();

function showError(msg) {
    const box = document.getElementById('errorBox');
    const text = document.getElementById('errorText');
    text.textContent = msg;
    box.style.display = 'block';
}

function debugLog(msg) {
    const div = document.getElementById('debug');
    div.innerHTML += new Date().toLocaleTimeString() + ': ' + msg + '<br>';
}

debugLog('Скрипт запущен');
debugLog('API_URL: ' + API_URL);

const PRIZES = [
    { name: 'Ассорти шашлыков', emoji: '🥩' },
    { name: 'Бокал пива', emoji: '🍺' },
    { name: 'Повезёт в следующий раз!', emoji: '💨' },
    { name: 'Любое блюдо', emoji: '🍽' },
    { name: 'Депозит 1000 ₽', emoji: '💰' }
];

let sessionId = null;

async function init() {
    debugLog('init() started');
    const initData = tg.initData || '';
    if (!initData) {
        showError('Ошибка: приложение запущено не из Telegram. initData пуст.');
        debugLog('initData пуст');
        return;
    }
    debugLog('initData есть, длина: ' + initData.length);
    try {
        debugLog('Отправка запроса на /auth');
        const res = await fetch(API_URL + '/auth', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ initData })
        });
        debugLog('Ответ получен, статус: ' + res.status);
        const data = await res.json();
        debugLog('Данные: ' + JSON.stringify(data));
        if (!data.ok) {
            showError('Ошибка авторизации: ' + (data.error || 'неизвестно'));
            return;
        }
        sessionId = data.sessionId;
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('spinBtn').textContent = '🎰 Крутить рулетку';
        document.getElementById('spinBtn').onclick = spin;
    } catch(e) {
        debugLog('Исключение: ' + e.message);
        showError('Ошибка сети: ' + e.message);
    }
}

async function spin() {
    if (!sessionId) return;
    try {
        const res = await fetch(API_URL + '/spin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ sessionId })
        });
        const data = await res.json();
        debugLog('spin ответ: ' + JSON.stringify(data));
        if (!data.ok && data.error === 'Cooldown') {
            alert('Уже крутили сегодня!');
            return;
        }
        if (data.ok) {
            const prize = PRIZES[data.prizeIndex];
            document.getElementById('result').innerHTML = `<h2>${prize.emoji} ${prize.name}</h2>`;
        } else {
            alert('Ошибка: ' + (data.error || 'неизвестно'));
        }
    } catch(e) {
        showError('Ошибка при spin: ' + e.message);
    }
}

init();
</script>
</body>
</html>
