<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пивотаун — Рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root { --bg: #0a0a10; --bg-card: #13131a; --gold: #d4a843; --gold-bright: #f0c850; --gold-dark: #a08030; --text: #e8e8e8; --text-dim: #6a6a7a; --border: rgba(212,168,67,0.12); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding: 0; margin: 0; }
        .header { text-align: center; padding: 30px 16px 10px; }
        .logo { font-family: 'Oswald', sans-serif; font-size: 34px; font-weight: 700; color: var(--gold); letter-spacing: 4px; text-transform: uppercase; }
        .logo span { color: var(--text); }
        .tagline { font-size: 11px; color: var(--text-dim); letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; }
        .wrap { max-width: 420px; margin: 0 auto; padding: 0 16px 40px; }
        .card { background: linear-gradient(180deg, var(--bg-card) 0%, rgba(19,19,26,0.6)); border: 1px solid var(--border); border-radius: 24px; padding: 20px; position: relative; overflow: hidden; }
        .card::after { content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .badge { display: inline-block; background: rgba(212,168,67,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; text-align: center; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
        h1 .gold { color: var(--gold); }
        .desc { text-align: center; font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 20px; }
        .roulette-wrap { position: relative; width: 280px; height: 280px; margin: 0 auto 20px; }
        .ring-outer { position: absolute; inset: -8px; border-radius: 50%; background: linear-gradient(145deg, var(--gold-dark), var(--gold), var(--gold-dark)); padding: 3px; box-shadow: 0 0 60px rgba(212,168,67,0.15), 0 0 120px rgba(212,168,67,0.05); }
        .ring-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--bg); padding: 6px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; will-change: transform; }
        .wheel-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .seg-path { stroke: var(--bg); stroke-width: 2; }
        .seg-text { font-size: 11px; font-weight: 700; fill: rgba(255,255,255,0.7); text-anchor: middle; dominant-baseline: middle; text-transform: uppercase; }
        .seg-text.prize { fill: var(--gold-bright); }
        .seg-text.empty { fill: #ff6b6b; }
        .hub { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: linear-gradient(145deg, var(--gold), var(--gold-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 0 40px rgba(212,168,67,0.4); border: 4px solid var(--bg); }
        .hub-text { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; color: var(--bg); text-transform: uppercase; }
        .arrow { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); z-index: 20; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .arrow svg { width: 28px; height: 36px; }
        .lights { position: absolute; inset: -14px; border-radius: 50%; pointer-events: none; }
        .light { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .spin-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); border: none; border-radius: 16px; color: var(--bg); font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 6px 30px rgba(212,168,67,0.25); transition: all 0.3s; }
        .spin-btn:disabled { opacity: 0.3; cursor: not-allowed; background: #2a2a35; box-shadow: none; }
        .timer { background: rgba(212,168,67,0.04); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; display: none; margin-top: 16px; }
        .timer.active { display: block; }
        .timer-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
        .timer-digits { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; color: var(--gold); }
        .result { background: linear-gradient(180deg, rgba(212,168,67,0.06), rgba(212,168,67,0.02)); border: 1px solid var(--border); border-radius: 20px; padding: 24px; text-align: center; margin-top: 20px; display: none; animation: popIn 0.5s ease; }
        .result.active { display: block; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .res-emoji { font-size: 56px; margin-bottom: 8px; display: block; }
        .res-title { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .res-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; }
        .res-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--bg); text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 13px; text-transform: uppercase; }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-bg.active { display: flex; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px; text-align: center; max-width: 320px; width: 100%; }
        .modal-ic { font-size: 48px; margin-bottom: 12px; }
        .modal-h { font-family: 'Oswald', sans-serif; font-size: 22px; color: var(--gold); margin-bottom: 8px; }
        .modal-p { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
        .modal-time { font-family: 'Oswald', sans-serif; font-size: 28px; color: var(--gold); margin: 12px 0; }
        .modal-btn { padding: 12px 28px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); border: none; border-radius: 12px; color: var(--bg); font-weight: 700; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">Пиво<span>таун</span></div>
    <div class="tagline">Рулетка Удачи</div>
</div>

<div class="wrap">
    <div class="card">
        <div style="text-align:center"><span class="badge">🎰 Акция дня</span></div>
        <h1><span class="gold">Крути</span> и Выигрывай</h1>
        <p class="desc">Одна попытка в сутки<br>Приз — при заказе от 1000₽</p>

        <div class="roulette-wrap">
            <div class="lights" id="lights"></div>
            <div class="arrow">
                <svg viewBox="0 0 28 36"><path d="M14 0L28 24L14 20L0 24Z" fill="#d4a843"/><circle cx="14" cy="28" r="6" fill="#f0c850" stroke="#0a0a10" stroke-width="2"/></svg>
            </div>
            <div class="ring-outer"><div class="ring-inner"><div class="wheel" id="wheel"><svg class="wheel-svg" viewBox="0 0 300 300" id="wheelSvg"></svg><div class="hub"><span class="hub-text">GO</span></div></div></div></div>
        </div>

        <button class="spin-btn" id="spinBtn">🎰 Крутить рулетку</button>
        <div class="timer" id="timer"><div class="timer-label">Следующая попытка через</div><div class="timer-digits" id="timerDigits">23:59:59</div></div>

        <div class="result" id="result">
            <span class="res-emoji" id="resEmoji">🎉</span>
            <div class="res-title" id="resTitle"></div>
            <div class="res-desc" id="resDesc"></div>
            <a href="#" class="res-btn" id="resBtn" target="_blank">Забрать приз →</a>
        </div>
    </div>
</div>

<div class="modal-bg" id="cooldownModal">
    <div class="modal-box">
        <div class="modal-ic">🔒</div>
        <div class="modal-h">Уже крутили!</div>
        <div class="modal-p">Приходите завтра</div>
        <div class="modal-time" id="cooldownTime">--:--:--</div>
        <button class="modal-btn" id="closeModal">Понятно</button>
    </div>
</div>

<script>
const API_URL = 'https://d5dr6ldr9sl22jhrpg26.z2ka767n.apigw.yandexcloud.net';
const tg = window.Telegram.WebApp;
tg.expand();

const PRIZES = [
    { name: 'Ассорти шашлыков', emoji: '🥩', desc: 'ДЖЕКПОТ! Ассорти шашлыков на 1800₽. При заказе от 1000₽!', color: '#e67e22', btn: 'Забрать джекпот →', link: 'https://wa.me/79037995356' },
    { name: 'Бокал пива', emoji: '🍺', desc: 'Любой сорт на выбор! При заказе от 1000₽.', color: '#d4a843', btn: 'Забрать пиво →', link: 'https://wa.me/79037995356' },
    { name: 'Повезёт в следующий раз!', emoji: '💨', desc: 'Завтра — новая попытка!', color: '#ff6b6b', btn: null, link: null },
    { name: 'Любое блюдо', emoji: '🍽', desc: 'Выберите любое блюдо из меню. При заказе от 1000₽.', color: '#27ae60', btn: 'Забрать блюдо →', link: 'https://wa.me/79037995356' },
    { name: 'Депозит 1000 ₽', emoji: '💰', desc: '1000₽ на ваш счёт в Пивотаун!', color: '#2980b9', btn: 'Активировать →', link: 'https://wa.me/79037995356' }
];

const SEGMENTS = PRIZES.length;
const SEGMENT_ANGLE = 360 / SEGMENTS;
const CENTER = 150;
const RADIUS = 130;

let sessionId = null;
let spinning = false;
let currentRotation = 0;

function drawWheel() {
    const svg = document.getElementById('wheelSvg');
    svg.innerHTML = '';
    const colors = ['#1a1510', '#1a1a0f', '#15151c', '#101a15', '#1c1010'];
    for (let i = 0; i < SEGMENTS; i++) {
        const startDeg = i * SEGMENT_ANGLE - 90;
        const endDeg = (i + 1) * SEGMENT_ANGLE - 90;
        const startRad = startDeg * Math.PI / 180;
        const endRad = endDeg * Math.PI / 180;
        const x1 = CENTER + RADIUS * Math.cos(startRad);
        const y1 = CENTER + RADIUS * Math.sin(startRad);
        const x2 = CENTER + RADIUS * Math.cos(endRad);
        const y2 = CENTER + RADIUS * Math.sin(endRad);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${CENTER} ${CENTER} L ${x1} ${y1} A ${RADIUS} ${RADIUS} 0 0 1 ${x2} ${y2} Z`);
        path.setAttribute('fill', colors[i]);
        path.setAttribute('class', 'seg-path');
        svg.appendChild(path);

        const textDeg = startDeg + SEGMENT_ANGLE / 2;
        const textRad = textDeg * Math.PI / 180;
        const tx = CENTER + (RADIUS * 0.6) * Math.cos(textRad);
        const ty = CENTER + (RADIUS * 0.6) * Math.sin(textRad);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', tx); text.setAttribute('y', ty);
        text.setAttribute('class', 'seg-text ' + (i === 2 ? 'empty' : 'prize'));
        text.setAttribute('transform', `rotate(${textDeg + 90}, ${tx}, ${ty})`);
        const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        tspan.textContent = PRIZES[i].emoji;
        tspan.setAttribute('x', tx); tspan.setAttribute('dy', '0.3em'); tspan.setAttribute('font-size', '24');
        text.appendChild(tspan);
        svg.appendChild(text);
    }
    const lights = document.getElementById('lights');
    lights.innerHTML = '';
    for (let i = 0; i < 16; i++) {
        const angle = (i / 16) * Math.PI * 2 - Math.PI / 2;
        const light = document.createElement('div');
        light.className = 'light';
        light.style.left = (50 + 48 * Math.cos(angle)) + '%';
        light.style.top = (50 + 48 * Math.sin(angle)) + '%';
        lights.appendChild(light);
    }
}

async function init() {
    drawWheel();
    const initData = tg.initData || '';
    if (!initData) {
        document.body.innerHTML = '<h2 style="color:white;text-align:center;margin-top:100px">Откройте из Telegram</h2>';
        return;
    }
    try {
        const res = await fetch(API_URL + '/auth', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ initData })
        });
        const data = await res.json();
        if (!data.ok) { alert('Ошибка авторизации'); return; }
        sessionId = data.sessionId;
        const btn = document.getElementById('spinBtn');
        btn.disabled = false;
        btn.onclick = spin;
        if (!data.canSpin && data.expires) {
            startTimer(data.expires);
            const prize = PRIZES.find(p => p.name === data.lastPrize);
            if (prize) showResult(prize);
        }
    } catch(e) { alert('Ошибка сети'); }
}

function calcTargetRotation(idx) {
    return (5 + Math.floor(Math.random() * 3)) * 360 + idx * SEGMENT_ANGLE + (Math.random() - 0.5) * 20;
}

function animateSpin(targetDeg, onEnd) {
    const wheel = document.getElementById('wheel');
    const start = performance.now();
    const startRot = currentRotation;
    currentRotation += targetDeg;
    function step(now) {
        const p = Math.min((now - start) / 4000, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        wheel.style.transform = `rotate(${startRot + targetDeg * eased}deg)`;
        if (p < 1) requestAnimationFrame(step);
        else onEnd();
    }
    requestAnimationFrame(step);
}

function showResult(prize) {
    const box = document.getElementById('result');
    document.getElementById('resEmoji').textContent = prize.emoji;
    document.getElementById('resTitle').textContent = prize.name;
    document.getElementById('resTitle').style.color = prize.color;
    document.getElementById('resDesc').textContent = prize.desc;
    const btn = document.getElementById('resBtn');
    if (prize.btn) { btn.style.display = 'inline-flex'; btn.textContent = prize.btn; btn.href = prize.link; }
    else btn.style.display = 'none';
    box.classList.add('active');
}

function startTimer(expires) {
    const box = document.getElementById('timer');
    const digits = document.getElementById('timerDigits');
    const btn = document.getElementById('spinBtn');
    box.classList.add('active');
    btn.disabled = true;
    function tick() {
        const left = expires - Date.now();
        if (left <= 0) { box.classList.remove('active'); btn.disabled = false; return; }
        const h = Math.floor(left / 3600000);
        const m = Math.floor((left % 3600000) / 60000);
        const s = Math.floor((left % 60000) / 1000);
        digits.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        requestAnimationFrame(tick);
    }
    tick();
}

async function spin() {
    if (spinning || !sessionId) return;
    spinning = true;
    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    try {
        const res = await fetch(API_URL + '/spin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ sessionId })
        });
        const data = await res.json();
        if (!data.ok) {
            if (data.error === 'Cooldown') {
                document.getElementById('cooldownModal').classList.add('active');
                const update = () => {
                    const left = data.expires - Date.now();
                    if (left <= 0) { document.getElementById('cooldownModal').classList.remove('active'); return; }
                    const h = Math.floor(left/3600000), m = Math.floor((left%3600000)/60000), s = Math.floor((left%60000)/1000);
                    document.getElementById('cooldownTime').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    requestAnimationFrame(update);
                };
                update();
            }
            spinning = false;
            btn.disabled = false;
            return;
        }
        animateSpin(calcTargetRotation(data.prizeIndex), () => {
            showResult(PRIZES[data.prizeIndex]);
            startTimer(Date.now() + 86400000);
            spinning = false;
        });
    } catch(e) {
        alert('Ошибка сети');
        spinning = false;
        btn.disabled = false;
    }
}

document.getElementById('closeModal').onclick = () => document.getElementById('cooldownModal').classList.remove('active');
init();
</script>
</body>
</html>
